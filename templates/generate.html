{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto bg-gray-800 bg-opacity-80 rounded-lg shadow-xl p-8 mt-10 card-hover animate-fade-in">
    <h2 class="text-2xl font-semibold text-purple-400 mb-6 text-center">Generate Images</h2>
    {% if error %}
    <p class="text-red-400 mb-4 text-center">{{ error }}</p>
    {% endif %}
    <form id="generate-form" action="/generate" method="POST" class="space-y-6">
        <div class="relative">
            <label for="prompt" class="block text-sm font-medium text-gray-300">Image Prompt</label>
            <div class="mt-1 flex items-center">
                <textarea id="prompt" name="prompt" rows="4" required
                    class="block w-full p-3 bg-gray-700 border border-gray-600 rounded-md focus:ring-purple-500 focus:border-purple-500 text-white transition-all duration-300"
                    placeholder="Describe the image you want to generate"></textarea>
                <button type="button" id="enhance-button"
                    class="absolute right-2 top-10 text-gray-400 hover:text-purple-400 transition-all duration-300">
                    <i data-lucide="wand-2" id="enhance-icon" class="w-6 h-6"></i>
                    <img src="/static/images/Hourglass.gif" id="enhance-loading" class="hidden w-6 h-6" alt="Loading">
                </button>
            </div>
        </div>
        <div>
            <label for="style" class="block text-sm font-medium text-gray-300">Style</label>
            <select id="style" name="style"
                class="mt-1 block w-full p-3 bg-gray-700 border border-gray-600 rounded-md focus:ring-purple-500 focus:border-purple-500 text-white">
                <option value="digital-art">Digital Art</option>
                <option value="realistic">Realistic</option>
                <option value="cartoon">Cartoon</option>
                <option value="abstract">Abstract</option>
            </select>
        </div>
        <button type="submit" id="generate-button"
            class="w-full flex items-center justify-center bg-purple-600 text-white p-3 rounded-md hover:bg-purple-700 hover:scale-105 transition-all duration-300">
            <i data-lucide="sparkles" class="mr-2 w-5 h-5"></i>Generate Images<i data-lucide="sparkles"
                class="ml-2 w-5 h-5"></i>
            <img src="/static/images/Hourglass.gif" id="generate-loading" class="hidden w-5 h-5 ml-2" alt="Loading">
        </button>
    </form>

    <!-- Display User's Images -->
    {% if images %}
    <div class="mt-8">
        <h3 class="text-xl font-semibold text-purple-400 mb-4">Your Generated Images</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {% for image in images %}
            <div class="bg-gray-700 rounded-md p-4 card-hover">
                <img src="{{ url_for('serve_image', filename=image.filename) }}" alt="{{ image.prompt }}"
                    class="w-full h-48 object-cover rounded-md mb-2">
                <p class="text-gray-300 text-sm truncate">Prompt: {{ image.prompt }}</p>
                <a href="{{ url_for('download_image', filename=image.filename) }}"
                    class="text-purple-400 hover:underline text-sm flex items-center mt-2">
                    <i data-lucide="download" class="mr-1 w-4 h-4"></i> Download
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>


<script>
    document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
        const form = document.getElementById("generate-form");
        const button = document.getElementById("generate-button");
        const loadingGif = document.getElementById("generate-loading");
        const enhanceButton = document.getElementById("enhance-button");
        const enhanceIcon = document.getElementById("enhance-icon");
        const enhanceLoading = document.getElementById("enhance-loading");
        const promptTextarea = document.getElementById("prompt");

        form.addEventListener("submit", (e) => {
            button.querySelector("i").classList.add("hidden");
            loadingGif.classList.remove("hidden");
            button.disabled = true;
        });

        enhanceButton.addEventListener("click", async () => {
            const prompt = promptTextarea.value.trim();
            if (!prompt) {
                alert("Please enter a prompt to enhance.");
                return;
            }

            enhanceIcon.classList.add("hidden");
            enhanceLoading.classList.remove("hidden");
            enhanceButton.disabled = true;

            try {
                const response = await fetch("/enhance_prompt", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    promptTextarea.value = data.enhanced_prompt;
                }
            } catch (error) {
                alert("Failed to enhance prompt: " + error.message);
            } finally {
                enhanceIcon.classList.remove("hidden");
                enhanceLoading.classList.add("hidden");
                enhanceButton.disabled = false;
            }
        });
    });
</script>

{% endblock %}
