{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 bg-opacity-80 rounded-lg shadow-xl p-8 mt-10 card-hover">
    <h2 class="text-2xl font-semibold text-purple-400 mb-6 text-center">Generate Your Image</h2>
    {% if error %}
    <p class="text-red-400 mb-4">{{ error }}</p>
    {% endif %}
    <form action="/generate" method="POST" class="space-y-6">
        <div>
            <label for="prompt" class="block text-sm font-medium text-gray-300">Describe Your Image</label>
            <textarea id="prompt" name="prompt" required rows="4"
                class="mt-1 block w-full p-3 bg-gray-700 border border-gray-600 rounded-md focus:ring-purple-500 focus:border-purple-500 text-white"
                placeholder="E.g., A futuristic city at sunset"></textarea>
        </div>
        <div>
            <label for="style" class="block text-sm font-medium text-gray-300">Select Style</label>
            <select id="style" name="style"
                class="mt-1 block w-full p-3 bg-gray-700 border border-gray-600 rounded-md focus:ring-purple-500 focus:border-purple-500 text-white">
                <option value="digital-art">Digital Art</option>
                <option value="photography">Photography</option>
                <option value="3d-render">3D Render</option>
                <option value="painting">Painting</option>
            </select>
        </div>
        <button type="submit"
            class="w-full flex items-center justify-center bg-purple-600 text-white p-3 rounded-md hover:bg-purple-700 transition">
            <i data-lucide="sparkles" class="mr-2"></i> Generate Images</button>
    </form>
</div>
{% endblock %}
