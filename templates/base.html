<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef2ff">
    <title>ArtistryAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body
    class="min-h-screen flex flex-col text-slate-900 bg-gradient-to-br from-indigo-50 via-white to-cyan-50 animate-bg-shift">
    <!-- Ambient Background -->
    <div class="app-bg" aria-hidden="true">
        <div class="app-bg__mesh"></div>
        <div class="app-bg__noise"></div>
    </div>

    <!-- Navigation -->
    <header class="relative z-10 border-b border-slate-900/10 bg-white/40 backdrop-blur">
        <nav class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <span class="app-mark">
                    <i data-lucide="sparkles" class="w-5 h-5" style="stroke-width: 2.5px;"></i>
                </span>
                <span
                    class="text-lg md:text-xl font-semibold tracking-tight text-slate-900 group-hover:text-slate-900/80 transition">
                    ArtistryAI
                </span>
            </a>

            <div class="flex items-center gap-2 md:gap-3">
                <a href="/" class="app-navlink">
                    <i data-lucide="home" class="w-4 h-4" style="stroke-width: 2.5px;"></i>
                    <span class="hidden sm:inline">Home</span>
                </a>
                <a href="/generate" class="app-navlink app-navlink--primary">
                    <i data-lucide="wand-2" class="w-4 h-4" style="stroke-width: 2.5px;"></i>
                    <span>Generate</span>
                </a>
                <a href="/generate-text" class="app-navlink app-navlink--primary">
                    <i data-lucide="type" class="w-4 h-4" style="stroke-width: 2.5px;"></i>
                    <span>Generate Text</span>
                </a>
                <a href="/login" class="app-navlink">
                    <i data-lucide="log-in" class="w-4 h-4" style="stroke-width: 2.5px;"></i>
                    <span class="hidden sm:inline">Login</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 flex-grow container mx-auto w-full px-4 py-8 md:py-12">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="relative z-10 border-t border-slate-900/10 bg-white/40 backdrop-blur">
        <div class="container mx-auto px-4 py-6 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="text-slate-700 text-sm">© 2026 ArtistryAI. Powered by Together AI.</p>
            <div class="text-slate-600 text-sm flex items-center gap-2">
                <i data-lucide="shield" class="w-4 h-4" style="stroke-width: 2.5px;"></i>
                <span>Your prompts stay in your session.</span>
            </div>
        </div>
    </footer>

    <!-- GSAP Animations -->
    <script src="/static/js/animations.js"></script>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
