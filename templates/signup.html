{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto app-surface p-6 md:p-8 card-hover animate-fade-in">
    <div class="text-center mb-7">
        <div class="mx-auto mb-4 app-mark" style="width: 44px; height: 44px;">
            <i data-lucide="user-plus" class="w-5 h-5" style="stroke-width: 2.5px;"></i>
        </div>
        <h2 class="app-title text-2xl font-semibold">Create your account</h2>
        <p class="text-white/65 mt-2">Sign up to save your workflow and jump back in anytime.</p>
    </div>
    {% if error %}
    <div class="mb-5 rounded-xl border border-rose-400/30 bg-rose-500/10 px-4 py-3 text-rose-200">
        <div class="flex items-start gap-2">
            <i data-lucide="triangle-alert" class="w-5 h-5 mt-0.5" style="stroke-width: 2.5px;"></i>
            <p class="text-sm">{{ error }}</p>
        </div>
    </div>
    {% endif %}
    <form id="signup-form" action="/signup" method="POST" class="space-y-6">
        <div class="relative">
            <label for="username" class="block text-sm font-medium text-white/70">Username</label>
            <div class="mt-1 flex items-center">
                <i data-lucide="user" class="absolute left-3 w-5 h-5 text-white/40"></i>
                <input id="username" name="username" type="text" required
                    class="block w-full pl-10 p-3 bg-white/5 border border-white/10 rounded-xl focus:border-purple-400/50 text-white placeholder:text-white/40 transition"
                    placeholder="Your username">
            </div>
        </div>
        <div class="relative">
            <label for="email" class="block text-sm font-medium text-white/70">Email</label>
            <div class="mt-1 flex items-center">
                <i data-lucide="mail" class="absolute left-3 w-5 h-5 text-white/40"></i>
                <input id="email" name="email" type="email" required
                    class="block w-full pl-10 p-3 bg-white/5 border border-white/10 rounded-xl focus:border-purple-400/50 text-white placeholder:text-white/40 transition"
                    placeholder="you@example.com">
            </div>
        </div>
        <div class="relative">
            <label for="password" class="block text-sm font-medium text-white/70">Password</label>
            <div class="mt-1 flex items-center">
                <i data-lucide="lock" class="absolute left-3 w-5 h-5 text-white/40"></i>
                <input id="password" name="password" type="password" required
                    class="block w-full pl-10 p-3 bg-white/5 border border-white/10 rounded-xl focus:border-purple-400/50 text-white placeholder:text-white/40 transition"
                    placeholder="••••••••">
            </div>
        </div>
        <button type="submit" id="signup-button"
            class="w-full flex items-center justify-center bg-purple-600/90 text-white p-3.5 rounded-xl hover:bg-purple-600 hover:scale-[1.01] transition-all duration-300 border border-purple-400/20">
            <i data-lucide="user-plus" class="mr-2 w-5 h-5" style="stroke-width: 2.5px;"></i> Sign up
            <img src="/static/images/Hourglass.gif" id="signup-loading" class="hidden w-5 h-5 ml-2" alt="Loading">
        </button>
    </form>
    <p class="mt-5 text-center text-white/60">
        Already have an account? <a href="/login" class="text-purple-300 hover:text-white transition underline-offset-4 hover:underline">Log in</a>
    </p>
</div>


<script>
    document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
        const form = document.getElementById("signup-form");
        const button = document.getElementById("signup-button");
        const loadingGif = document.getElementById("signup-loading");

        form.addEventListener("submit", (e) => {
            // Show loading GIF
            const icon = button.querySelector("i");
            if (icon) icon.classList.add("hidden");
            loadingGif.classList.remove("hidden");
            button.disabled = true;
        });
    });
</script>

{% endblock %}
